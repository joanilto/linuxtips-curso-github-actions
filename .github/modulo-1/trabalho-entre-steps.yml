name: Vendo arquivos compartilhados entre Steeps

on:
  push:
    branches:
      - master

jobs:
  entre-steps:
    runs-on: ubuntu-latest
    steps:
      - name: Confere versao do ubuntu
        run: cat /etc/os-release

      - name: Exibit uma mensagem
        run: echo  "Estou Fazendo o curso guthub Action da Linuxtips" > mensagem.txt

      - name: Apenas uma steps
        run: ls -lha

      - name:  le conteudo do mensagem,txt
        run: cat mensagem.txt 
