name: Listar e analisar imagens Docker
on:
  workflow_dispatch
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - 
        name: Configuração inicial do Docker
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }