name: Vendo arquivos compartilhados entre jobs
on:
  workflow_dispatch
jobs:
  job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Confere versao do ubuntu
        run: cat /etc/os-release

      - name: Exibit uma mensagem
        run: echo  "Estou Fazendo o curso guthub Action da Linuxtips" > ${{github.workspace}}//mensagem.txt

      - uses: actions/upload-artifact@v4
        wih:
        name: strigus-upload
        path: ${{github.workspace}}//mensagem.txt
         
  job_2:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
      - name: Ver o conteúdo do diretório
        run: ls -lha

      - uses: actions/download-artifact@v4
        with:
          name: strigus-upload
          path: strigus

      - name: Ver o contedudo do diretorio strigus
        run: ls -lha && ls ./strigus/

      - name: Acessa arquivo da mensagem
        run: mv strigus/mensagem.txt .&& rm -rf ./strigus

      - name: ver o conteúdo do diretorio
        run: ls -lha

      - name: Acessa arquivo mensagem
        run: mv strigus/mensagem.txt . && rm -rf ./strigus        